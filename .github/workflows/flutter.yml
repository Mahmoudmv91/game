name: Test and build Dream Garden

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-garden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test browser rules
        run: |
          node --test preview/tests/engine.test.mjs
          node --check preview/app.mjs
      - name: Install official Flutter stable SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Prepare native platform scaffold
        run: |
          flutter config --no-analytics
          flutter --version
          flutter create --platforms=android,web --project-name=dream_garden "$RUNNER_TEMP/dream-garden-build"
          cp pubspec.yaml analysis_options.yaml "$RUNNER_TEMP/dream-garden-build/"
          cp -a lib/. "$RUNNER_TEMP/dream-garden-build/lib/"
          cp -a assets/. "$RUNNER_TEMP/dream-garden-build/assets/"
          rm -f "$RUNNER_TEMP/dream-garden-build/test/widget_test.dart"
          cp -a test/. "$RUNNER_TEMP/dream-garden-build/test/"
      - name: Resolve dependencies, analyze and test Flutter
        working-directory: ${{ runner.temp }}/dream-garden-build
        run: |
          flutter pub get
          dart format lib test
          flutter analyze
          flutter test
      - name: Build installable test APK
        working-directory: ${{ runner.temp }}/dream-garden-build
        run: flutter build apk --debug
      - name: Build Flutter web
        working-directory: ${{ runner.temp }}/dream-garden-build
        run: flutter build web --release --base-href /flutter/
      - name: Upload Android test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dream-garden-android-debug
          path: ${{ runner.temp }}/dream-garden-build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Flutter web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dream-garden-flutter-web
          path: ${{ runner.temp }}/dream-garden-build/build/web/
          if-no-files-found: error
          retention-days: 14
